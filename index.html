<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messages for My Baby 🌸</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #fff5f8 0%, #fff0f5 50%, #fdf2f8 100%);
      --card-bg: rgba(255, 255, 255, 0.92);
      --pink-primary: #ec4899;
      --pink-dark: #db2777;
      --pink-soft: #fce7f3;
      --pink-border: #fbcfe8;
      --text-main: #374151;
      --text-muted: #6b7280;
      --shadow-soft: 0 10px 25px -5px rgba(236, 72, 153, 0.08), 0 8px 10px -6px rgba(236, 72, 153, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      line-height: 1.65;
      min-height: 100vh;
      padding: 2rem 1rem 5rem;
      overflow-x: hidden;
      position: relative;
    }

    #sakura-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .sakura-petal {
      position: absolute;
      top: -24px;
      border-radius: 100% 0 100% 0;
      background: linear-gradient(135deg, #fbcfe8 0%, #f472b6 100%);
      opacity: 0.72;
      animation: sakuraFall linear infinite;
      will-change: transform;
    }

    @keyframes sakuraFall {
      0% {
        transform: translate3d(0, -24px, 0) rotate(0deg);
        opacity: 0;
      }
      12% {
        opacity: 0.75;
      }
      88% {
        opacity: 0.75;
      }
      100% {
        transform: translate3d(var(--drift, 65px), 105vh, 0) rotate(var(--spin, 540deg));
        opacity: 0;
      }
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }

    .owner-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
    }

    .owner-status {
      font-size: 0.78rem;
      color: #9d174d;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid var(--pink-border);
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      font-weight: 600;
    }

    .btn-pill {
      background: #ffffff;
      color: #be185d;
      border: 1px solid var(--pink-border);
      border-radius: 999px;
      padding: 0.35rem 0.85rem;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-pill:hover {
      background: var(--pink-soft);
    }

    .btn-primary {
      background: var(--pink-primary);
      color: #ffffff;
      border: none;
      border-radius: 999px;
      padding: 0.55rem 1.1rem;
      font-family: inherit;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-primary:hover {
      background: var(--pink-dark);
    }

    header {
      text-align: center;
      margin-bottom: 1.75rem;
      padding: 2.25rem 1.5rem;
      background: var(--card-bg);
      border-radius: 28px;
      border: 1px solid var(--pink-border);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(8px);
    }

    .flowers {
      font-size: 1.35rem;
      letter-spacing: 0.5rem;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: 'Caveat', cursive;
      font-size: 2.85rem;
      color: var(--pink-dark);
      line-height: 1.1;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 500;
      margin-bottom: 0.75rem;
    }

    .tagline {
      font-size: 0.9rem;
      color: #4b5563;
      max-width: 500px;
      margin: 0 auto 1rem;
      background: #fff8fb;
      padding: 0.75rem 1rem;
      border-radius: 16px;
      border: 1px dashed var(--pink-border);
    }

    .corner-badge {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #be185d;
      background: var(--pink-soft);
      padding: 0.3rem 0.9rem;
      border-radius: 999px;
    }

    .composer-card {
      display: none;
      background: var(--card-bg);
      border-radius: 24px;
      border: 1px solid var(--pink-border);
      padding: 1.4rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-soft);
    }

    .composer-card.active {
      display: block;
    }

    .composer-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: #be185d;
      margin-bottom: 0.65rem;
    }

    textarea, input[type="text"], input[type="email"], input[type="password"] {
      width: 100%;
      border: 1px solid var(--pink-border);
      border-radius: 16px;
      padding: 0.75rem 1rem;
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--text-main);
      background: #ffffff;
      outline: none;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
      margin-bottom: 0.75rem;
    }

    textarea:focus, input:focus {
      border-color: var(--pink-primary);
    }

    .controls {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 200px;
      padding: 0.7rem 1.1rem;
      border-radius: 999px !important;
      box-shadow: 0 2px 8px rgba(236, 72, 153, 0.05);
    }

    .stats-pill {
      display: flex;
      align-items: center;
      padding: 0.6rem 1rem;
      background: #ffffff;
      border: 1px solid var(--pink-border);
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      color: #be185d;
    }

    .entry-card {
      background: var(--card-bg);
      border-radius: 24px;
      border: 1px solid var(--pink-border);
      padding: 1.65rem;
      margin-bottom: 1.35rem;
      box-shadow: var(--shadow-soft);
    }

    .entry-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.85rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .entry-date {
      background: #fdf2f8;
      color: #be185d;
      font-weight: 600;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
    }

    .owner-actions {
      display: inline-flex;
      gap: 0.4rem;
    }

    .btn-mini {
      background: #fff8fb;
      border: 1px solid var(--pink-border);
      color: #9d174d;
      border-radius: 999px;
      padding: 0.2rem 0.65rem;
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-mini:hover {
      background: var(--pink-soft);
    }

    .btn-mini.delete:hover {
      background: #fee2e2;
      border-color: #fca5a5;
      color: #b91c1c;
    }

    .entry-body {
      font-size: 0.96rem;
      color: #1f2937;
      white-space: pre-line;
      word-break: break-word;
      margin-bottom: 1.15rem;
    }

    .entry-body a {
      display: inline-block;
      margin-top: 0.35rem;
      color: var(--pink-dark);
      background: #fdf2f8;
      padding: 0.4rem 0.85rem;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
      border: 1px solid var(--pink-border);
    }

    .reactions-bar {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex-wrap: wrap;
      padding-top: 0.85rem;
      border-top: 1px solid #fdf2f8;
    }

    .reaction-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-right: 0.25rem;
      font-weight: 500;
    }

    .emoji-btn {
      background: #fff8fb;
      border: 1px solid #fce7f3;
      border-radius: 999px;
      padding: 0.28rem 0.65rem;
      font-size: 1rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      transition: transform 0.12s, background 0.12s;
    }

    .emoji-btn:hover {
      transform: scale(1.08);
      background: #fce7f3;
    }

    .emoji-btn.active {
      background: #fbcfe8;
      border-color: #f472b6;
    }

    .emoji-count {
      font-size: 0.76rem;
      font-weight: 700;
      color: #be185d;
    }

    .comments-section {
      margin-top: 0.85rem;
      padding-top: 0.75rem;
      border-top: 1px dashed #fce7f3;
    }

    .comment-item {
      background: #fff9fc;
      border-radius: 14px;
      padding: 0.6rem 0.85rem;
      margin-bottom: 0.5rem;
      font-size: 0.85rem;
      border: 1px solid #fce7f3;
    }

    .comment-author {
      font-weight: 700;
      color: #be185d;
      font-size: 0.78rem;
      margin-bottom: 0.15rem;
    }

    .comment-form {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      margin-top: 0.5rem;
    }

    .comment-row {
      display: flex;
      gap: 0.45rem;
    }

    .comment-name-input {
      max-width: 150px;
      padding: 0.48rem 0.75rem !important;
      border-radius: 999px !important;
      font-size: 0.82rem !important;
    }

    .comment-text-input {
      flex: 1;
      padding: 0.48rem 0.85rem !important;
      border-radius: 999px !important;
      font-size: 0.84rem !important;
    }

    .comment-submit {
      background: var(--pink-primary);
      color: white;
      border: none;
      border-radius: 999px;
      padding: 0.48rem 1rem;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.45);
      z-index: 20;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      background: #ffffff;
      border: 1px solid var(--pink-border);
      border-radius: 24px;
      padding: 1.5rem;
      width: 100%;
      max-width: 400px;
      box-shadow: var(--shadow-soft);
    }

    .modal-card h2 {
      font-size: 1.1rem;
      color: #be185d;
      margin-bottom: 0.85rem;
    }

    .modal-field {
      margin-bottom: 0.75rem;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .empty-state {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--text-muted);
      background: var(--card-bg);
      border-radius: 24px;
      border: 1px dashed var(--pink-border);
    }

    footer {
      text-align: center;
      margin-top: 2.5rem;
      font-size: 0.82rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div id="sakura-container" aria-hidden="true"></div>

  <div class="container">
    <div class="owner-bar">
      <span class="owner-status" id="ownerBadge">Viewing as guest</span>
      <button class="btn-pill" id="toggleComposerBtn" style="display:none;" onclick="toggleComposer()">+ New Entry</button>
      <button class="btn-pill" id="authActionBtn" onclick="openAuthModal()">Owner Sign In</button>
    </div>

    <header>
      <div class="flowers">🌸　🌸　🌸</div>
      <h1>Messages for My Baby</h1>
      <p class="subtitle">little pieces of my day, saved here for you 🤍</p>
      <div class="tagline">
        For all the “BABY, GUESS WHAT—” moments that I wanted to tell you, even when I didn't send the message.
      </div>
      <span class="corner-badge">my little corner 🌸</span>
    </header>

    <section class="composer-card" id="composerCard">
      <div class="composer-title">Write a new entry 🌸</div>
      <textarea id="newPostContent" placeholder="Baby, guess what..."></textarea>
      <div style="display:flex; justify-content:flex-end; gap:0.5rem;">
        <button class="btn-pill" onclick="toggleComposer()">Cancel</button>
        <button class="btn-primary" onclick="createPost()">Save Entry</button>
      </div>
    </section>

    <div class="controls">
      <input type="text" id="searchInput" class="search-box" placeholder="Search entries or dates..." />
      <div class="stats-pill" id="entryCount">Loading...</div>
    </div>

    <main id="entriesFeed"></main>

    <footer>
      made with 🤍 · my little corner 🌸
    </footer>
  </div>

  <!-- Owner Sign In Modal -->
  <div class="modal-backdrop" id="authModal">
    <div class="modal-card">
      <h2>Owner Sign In 🤍</h2>
      <div class="modal-field">
        <input type="email" id="authEmail" placeholder="Email (maridelramirez01@gmail.com)" value="maridelramirez01@gmail.com" />
      </div>
      <div class="modal-field">
        <input type="password" id="authPassword" placeholder="Your Supabase password" />
      </div>
      <div class="modal-actions">
        <button class="btn-pill" onclick="closeAuthModal()">Cancel</button>
        <button class="btn-primary" onclick="signInOwner()">Sign In</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://botpymtjxkwfuxzzbprj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_qbZN_IgzgkCSqtarujiYAw_raquOF0A";
    const OWNER_EMAIL = "maridelramirez01@gmail.com";
    const EMOJIS = ["🤍", "🌸", "😆", "🤭", "😭"];

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let posts = [];
    let reactions = [];
    let comments = [];
    let currentUser = null;
    let isOwner = false;

    function spawnSakuraPetals() {
      const container = document.getElementById("sakura-container");
      const petalCount = 22;
      for (let i = 0; i < petalCount; i++) {
        const petal = document.createElement("div");
        petal.className = "sakura-petal";
        const size = 9 + Math.random() * 9;
        petal.style.width = `${size}px`;
        petal.style.height = `${size * 0.8}px`;
        petal.style.left = `${Math.random() * 100}%`;
        petal.style.setProperty("--drift", `${(Math.random() - 0.3) * 140}px`);
        petal.style.setProperty("--spin", `${360 + Math.random() * 540}deg`);
        const duration = 9 + Math.random() * 9;
        petal.style.animationDuration = `${duration}s`;
        petal.style.animationDelay = `${Math.random() * -duration}s`;
        container.appendChild(petal);
      }
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatText(text) {
      return escapeHtml(text).replace(
        /(https?:\/\/[^\s]+)/g,
        '<a href="$1" target="_blank" rel="noopener noreferrer">View Link ↗</a>'
      );
    }

    function formatDate(isoString) {
      const d = new Date(isoString);
      return d.toLocaleString("en-GB", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
    }

    function updateOwnerUI() {
      const badge = document.getElementById("ownerBadge");
      const authBtn = document.getElementById("authActionBtn");
      const composerBtn = document.getElementById("toggleComposerBtn");

      if (currentUser && isOwner) {
        badge.textContent = "Signed in as Owner 🤍";
        authBtn.textContent = "Sign Out";
        authBtn.onclick = signOutOwner;
        composerBtn.style.display = "inline-block";
      } else {
        badge.textContent = currentUser ? `Signed in (${currentUser.email})` : "Baby's Corner 🤍";
        authBtn.textContent = "Owner Sign In";
        authBtn.onclick = openAuthModal;
        composerBtn.style.display = "none";
        document.getElementById("composerCard").classList.remove("active");
      }
    }

    async function loadAllData() {
      const [postsRes, reactionsRes, commentsRes] = await Promise.all([
        db.from("curated_posts").select("*").order("created_at", { ascending: false }),
        db.from("curated_reactions").select("*"),
        db.from("curated_comments").select("*").order("created_at", { ascending: true })
      ]);

      if (!postsRes.error) posts = postsRes.data || [];
      if (!reactionsRes.error) reactions = reactionsRes.data || [];
      if (!commentsRes.error) comments = commentsRes.data || [];

      renderFeed(document.getElementById("searchInput").value);
    }

    function renderFeed(filter = "") {
      const feed = document.getElementById("entriesFeed");
      const countEl = document.getElementById("entryCount");
      const q = filter.trim().toLowerCase();

      const filtered = posts.filter((p) => {
        const dateStr = formatDate(p.created_at).toLowerCase();
        return (p.content || "").toLowerCase().includes(q) || dateStr.includes(q);
      });

      countEl.textContent = `${filtered.length} ${filtered.length === 1 ? "entry" : "entries"} 🤍`;

      if (filtered.length === 0) {
        feed.innerHTML = `<div class="empty-state">No entries found 🌸</div>`;
        return;
      }

      feed.innerHTML = filtered.map((post) => {
        const postReactions = reactions.filter((r) => r.post_id === post.id);
        const postComments = comments.filter((c) => c.post_id === post.id);

        const emojiHtml = EMOJIS.map((emoji) => {
          const count = postReactions.filter((r) => r.emoji === emoji).length;
          return `
            <button class="emoji-btn ${count > 0 ? "active" : ""}" onclick="addReaction('${post.id}', '${emoji}')">
              <span>${emoji}</span>
              ${count > 0 ? `<span class="emoji-count">${count}</span>` : ""}
            </button>
          `;
        }).join("");

        const commentsHtml = postComments.map((c) => `
          <div class="comment-item">
            <div class="comment-author">${escapeHtml(c.author_name || "Baby")} ${c.is_owner ? "· Owner 🤍" : ""}</div>
            <div>${escapeHtml(c.comment_text)}</div>
          </div>
        `).join("");

        const ownerControls = isOwner ? `
          <div class="owner-actions">
            <button class="btn-mini" onclick="editPost('${post.id}')">Edit</button>
            <button class="btn-mini delete" onclick="deletePost('${post.id}')">Delete</button>
          </div>
        ` : "";

        const defaultName = isOwner ? "Maddie" : "Baby";

        return `
          <article class="entry-card" id="post-${post.id}">
            <div class="entry-meta">
              <span class="entry-date">${formatDate(post.created_at)}</span>
              ${ownerControls}
            </div>
            <div class="entry-body" id="body-${post.id}">${formatText(post.content)}</div>
            <div class="reactions-bar">
              <span class="reaction-label">React:</span>
              ${emojiHtml}
            </div>
            <div class="comments-section">
              ${commentsHtml}
              <form class="comment-form" onsubmit="submitComment(event, '${post.id}')">
                <div class="comment-row">
                  <input type="text" class="comment-name-input" value="${defaultName}" placeholder="Name" required />
                  <input type="text" class="comment-text-input" placeholder="Leave a comment..." required />
                  <button type="submit" class="comment-submit">Post</button>
                </div>
              </form>
            </div>
          </article>
        `;
      }).join("");
    }

    window.addReaction = async function(postId, emoji) {
      const { error } = await db.from("curated_reactions").insert({ post_id: postId, emoji });
      if (!error) await loadAllData();
    };

    window.submitComment = async function(event, postId) {
      event.preventDefault();
      const form = event.target;
      const authorName = form.querySelector(".comment-name-input").value.trim() || "Baby";
      const commentText = form.querySelector(".comment-text-input").value.trim();
      if (!commentText) return;

      const { error } = await db.from("curated_comments").insert({
        post_id: postId,
        author_name: authorName,
        comment_text: commentText,
        is_owner: isOwner
      });

      if (!error) {
        form.querySelector(".comment-text-input").value = "";
        await loadAllData();
      }
    };

    window.toggleComposer = function() {
      document.getElementById("composerCard").classList.toggle("active");
    };

    window.createPost = async function() {
      if (!isOwner) return;
      const textarea = document.getElementById("newPostContent");
      const content = textarea.value.trim();
      if (!content) return;

      const { error } = await db.from("curated_posts").insert({ content });
      if (!error) {
        textarea.value = "";
        toggleComposer();
        await loadAllData();
      }
    };

    window.editPost = async function(postId) {
      if (!isOwner) return;
      const existing = posts.find((p) => p.id === postId);
      if (!existing) return;

      const updated = prompt("Edit entry:", existing.content);
      if (updated === null) return;

      const { error } = await db
        .from("curated_posts")
        .update({ content: updated.trim() })
        .eq("id", postId);

      if (!error) await loadAllData();
    };

    window.deletePost = async function(postId) {
      if (!isOwner) return;
      if (!confirm("Delete this entry permanently?")) return;

      const { error } = await db.from("curated_posts").delete().eq("id", postId);
      if (!error) await loadAllData();
    };

    window.openAuthModal = function() {
      document.getElementById("authModal").classList.add("open");
    };

    window.closeAuthModal = function() {
      document.getElementById("authModal").classList.remove("open");
    };

    window.signInOwner = async function() {
      const email = document.getElementById("authEmail").value.trim();
      const password = document.getElementById("authPassword").value;

      const { data, error } = await db.auth.signInWithPassword({ email, password });
      if (error) {
        alert("Sign in failed: " + error.message);
        return;
      }

      currentUser = data.user;
      isOwner = (currentUser?.email || "").toLowerCase() === OWNER_EMAIL.toLowerCase();
      document.getElementById("authPassword").value = "";
      closeAuthModal();
      updateOwnerUI();
      renderFeed(document.getElementById("searchInput").value);
    };

    window.signOutOwner = async function() {
      await db.auth.signOut();
      currentUser = null;
      isOwner = false;
      updateOwnerUI();
      renderFeed(document.getElementById("searchInput").value);
    };

    document.getElementById("searchInput").addEventListener("input", (e) => {
      renderFeed(e.target.value);
    });

    function subscribeRealtime() {
      db.channel("curated-live-channel")
        .on("postgres_changes", { event: "*", schema: "public", table: "curated_posts" }, () => loadAllData())
        .on("postgres_changes", { event: "*", schema: "public", table: "curated_reactions" }, () => loadAllData())
        .on("postgres_changes", { event: "*", schema: "public", table: "curated_comments" }, () => loadAllData())
        .subscribe();
    }

    (async function init() {
      spawnSakuraPetals();
      const { data } = await db.auth.getSession();
      currentUser = data?.session?.user || null;
      isOwner = (currentUser?.email || "").toLowerCase() === OWNER_EMAIL.toLowerCase();
      updateOwnerUI();
      await loadAllData();
      subscribeRealtime();
    })();
  </script>
</body>
</html>
